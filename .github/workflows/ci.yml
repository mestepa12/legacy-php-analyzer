name: CI

on:
  push:
  pull_request:

# Deny everything by default; each job opts in to the minimum it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: legacy-php-analyzer:ci
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-ansi

      - name: Run PHPUnit
        run: composer test

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: secrets removed in later commits are still leaked
          persist-credentials: false

      - name: Run gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif .

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true # code scanning unavailable on forks / private repos without GHAS
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependency-scan:
    name: Dependency scan (Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "$TRIVY_IMAGE" \
            fs --scanners vuln --include-dev-deps --severity "$TRIVY_SEVERITY" --ignore-unfixed \
            --exit-code 1 --format sarif --output trivy-fs.sarif .

      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  docker:
    name: Docker build + image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    permissions:
      contents: read
      security-events: write
    env:
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Optional: authenticated pulls avoid Docker Hub rate limits.
      # Only runs if DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are configured.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/tests/fixtures/simple-project:/project:ro" \
            "$IMAGE" /project > analysis.json
          jq -e '.meta.schemaVersion == 1 and .meta.filesScanned > 0' analysis.json

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/out" "$TRIVY_IMAGE" \
            image --scanners vuln --severity "$TRIVY_SEVERITY" --ignore-unfixed \
            --exit-code 1 --format sarif --output /out/trivy-image.sarif "$IMAGE"

      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
